version: '3.8'

services:
  gta-shorts-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hazwoper-gta-shorts-worker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../public/temp:/tmp/hazwoper-media
    environment:
      - WORKER_PORT=8000
      - MAX_CONCURRENT_JOBS=3
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
